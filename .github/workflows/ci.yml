# CI for this repo: script tests, shellcheck and actionlint.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: nuget-release script tests
        run: bash tests/nuget-release.test.sh

      - name: shellcheck
        run: shellcheck -S warning scripts/nuget-release/*.sh tests/*.sh

      - name: actionlint
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
