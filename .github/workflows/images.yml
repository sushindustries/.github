# Reusable workflow: build images, scan them with Trivy BEFORE anything is pushed, then push to a registry.
# Copied from the ruby-api-realm images workflow (PR #2); action pins are identical.
# Every build is scanned (fail on trivy-severity, default CRITICAL = nothing published).
# Pull requests and other refs build + scan only (no login, no push, no attestation).
# A push to the default branch or a v* tag pushes sha-<7> plus branch or semver tags and attests provenance.
# `latest` is set only for non-prerelease v* tags.
#
# Caller example: see README.md in this repo.
name: images

on:
  workflow_call:
    secrets:
      NUGET_TOKEN:
        required: false
        description: 'Optional. Passed to the build as BuildKit secret id=nuget_token (private NuGet feeds). Callers use `secrets: inherit`.'
    inputs:
      images:
        description: 'JSON array of {name, context, dockerfile (relative to context), build_contexts (optional, newline list name=path from repo root)}, e.g. [{"name":"app","context":".","dockerfile":"Dockerfile"}]'
        required: true
        type: string
      platforms:
        description: Target platforms for the pushed image (the scan build is always linux/amd64)
        required: false
        type: string
        default: linux/amd64
      trivy-severity:
        description: Trivy severities that fail the build
        required: false
        type: string
        default: CRITICAL
      registry:
        description: Registry host used for login
        required: false
        type: string
        default: ghcr.io
      image-prefix:
        description: Image name prefix; the image name is appended
        required: false
        type: string
        default: ghcr.io/sushindustries

permissions: {}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    env:
      # Push only on a push event to the default branch or a v* tag.
      DO_PUSH: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image-prefix }}/${{ matrix.name }}
          flavor: |
            latest=false
          tags: |
            # sha-<7> comes only from branch/PR builds; a v* tag build must not overwrite it.
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      # 1) Build into the runner's docker (no push), 2) scan it, 3) push only if the scan passed.
      #    The push step reuses the same layers from the gha cache.
      #    `load: true` supports one platform only, so the scan build is linux/amd64 (the runner arch).
      - name: Build for scan (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          secrets: ${{ secrets.NUGET_TOKEN != '' && format('nuget_token={0}', secrets.NUGET_TOKEN) || '' }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

      - name: Trivy scan (fail on severity, before push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          secrets: ${{ secrets.NUGET_TOKEN != '' && format('nuget_token={0}', secrets.NUGET_TOKEN) || '' }}
          platforms: ${{ inputs.platforms }}
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

      - name: Attest build provenance
        if: env.DO_PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image-prefix }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
